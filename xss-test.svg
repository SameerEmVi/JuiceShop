<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="200" height="120" fill="#eee"/>
  <text x="10" y="60" font-size="12">SVG XSS canary</text>

  <!-- Vector 1: <script> element -->
  <script type="text/javascript">alert('svg-script-canary')</script>

  <!-- Vector 2: onload attribute on a graphic element -->
  <rect width="1" height="1" onload="alert('svg-onload-canary')"/>

  <!-- Vector 3: xlink:href javascript: (older parsers) -->
  <a xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="javascript:alert('svg-href-canary')">
    <text x="10" y="90" font-size="12">click</text>
  </a>
</svg>
